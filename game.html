<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06060a"><title>IMPACT ARENA — TAP//PUNCH</title><link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/game.css"><link rel="stylesheet" href="css/effects.css"></head><body class="game-body"><div class="noise"></div><div class="scanlines"></div><div class="vignette"></div><div id="speedLines"></div><div id="flash"></div><div id="freeze"></div><div id="arena"><header class="hud"><div class="hud-stat"><small>TIME</small><strong id="time">30.0</strong></div><div class="hud-stat score-stat"><small>SCORE</small><strong id="score">000000</strong></div><div class="hud-stat combo-stat"><small>COMBO</small><strong id="combo">0</strong></div><div class="hud-stat"><small>MAX</small><strong id="maxComboHud">0</strong></div><button class="quit" id="quit">×</button></header><div class="mode-switch"><button class="active" data-mode="tap">TAP</button><button data-mode="punch">PUNCH</button></div><div class="arena-message" id="arenaMessage">FIND THE TARGET</div><div id="target" class="target"><div class="target-shadow"></div><img id="targetImg" alt="target"><div class="target-ring"></div></div><div id="fist" class="fist">👊</div><div id="effects"></div><div id="countdown" class="countdown">3</div><div id="startOverlay" class="overlay"><div class="ready">READY?</div><div class="ready-sub">TAP OR PUNCH THE TARGET</div><button id="go">START</button></div></div><div id="result" class="result hidden"><div class="result-card"><div class="eyebrow">TIME OVER</div><h2>IMPACT<br>REPORT</h2><div class="result-number" id="finalScore">0</div><div class="result-label">FINAL SCORE</div><div class="stats"><span>HITS <b id="finalHits">0</b></span><span>MAX COMBO <b id="finalCombo">0</b></span><span>CRITICAL <b id="finalCrit">0</b></span></div><input id="playerName" maxlength="16" placeholder="ニックネーム"><button id="saveScore">ランキングに登録</button><button class="ghost" id="again">もう一度</button><button class="text-btn" id="homeFromResult">ホームへ戻る</button></div></div><div id="registered" class="registered hidden"><div class="registered-card"><div class="check">✓</div><div class="eyebrow">REGISTERED</div><h2>RANKING<br>UPDATED</h2><p>ランキングへの登録が完了しました。</p><div class="loader-line"></div><small>HOMEへ戻ります...</small></div></div><script type="module" src="js/game.js"></script></body></html>
